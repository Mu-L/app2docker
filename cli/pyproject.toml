[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app2docker-cli"
version = "0.1.0"
description = "Trigger app2docker builds from a terminal or AI coding agent"
requires-python = ">=3.9"
dependencies = ["cryptography>=41.0.0"]

[project.scripts]
app2docker = "app2docker_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
